<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Display Timer - Cosenza</title>
    <style>
        body, html { 
            height: 100%; 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            font-family: 'Inter', sans-serif;  
        }

        .bg-image { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-image: url('sfondo2.jpeg'); 
            background-size: cover; 
            background-position: center;  
            z-index: -1; 
        }

        /* Layout principale */
        .main-wrapper {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            align-items: center;
            padding: 20px 0; 
            box-sizing: border-box;
        }

        /* Pannello Timer: Larghezza 50% e Altezza estesa */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 60px; 
            
            /* Modifiche richieste */
            width: 70%; /* Larghezza ripristinata al 50%[cite: 3] */
            max-width: 1100px;
            height: 70vh; /* Ingrandito verso il basso[cite: 3] */
            
            /* Layout interno per centratura assoluta */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            box-shadow: 0 40px 100px rgba(0,0,0,0.6); 
            margin-top: 20px;
        }

        .banner-bottom {
            width: 90%;
            max-width: 1200px;
            height: 150px; 
            background: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .banner-bottom img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: brightness(0.7); 
            opacity: 0.9; 
        }

        .period-tag { 
            background: #c21d23; 
            color: white; 
            padding: 12px 40px; 
            border-radius: 50px; 
            font-weight: 800; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
            font-size: 1.5rem;
        }
        
        .period-tag.prepartita { background: #1d3557; }
        .period-tag.intervallo { background: #ffd700; color: #000; }
        .period-tag.presuddendeath { background: #ff8c00; }
        .period-tag.suddendeath { 
            background: #000; 
            color: #ff0000; 
            border: 3px solid #ff0000; 
            box-shadow: 0 0 30px #ff0000; 
        }

        .timer-val { 
            font-size: 22rem; /* Font gigante al centro[cite: 3] */
            font-weight: 900; 
            color: #ffffff; 
            font-variant-numeric: tabular-nums; 
            line-height: 1; 
            font-family: 'Inter', monospace; 

            display: inline-block; 
    transform: scaleY(1.3); /* Aumenta l'altezza del 30% senza cambiare la larghezza */
    transform-origin: center; /* Mantiene la deformazione centrata */
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    
    <div class="main-wrapper">
        <div class="glass-panel">
            <div id="period" class="period-tag">PREPARTITA</div>
            <div id="display" class="timer-val">00:00</div>
        </div>

    <script>
        window.addEventListener('storage', (e) => {
            if (e.key === 'timer_update') {
                const data = JSON.parse(e.newValue);
                document.getElementById('display').textContent = data.time;
                document.getElementById('period').textContent = data.phase;
                
                const tag = document.getElementById('period');
                tag.className = 'period-tag';
                if (data.phase === "PREPARTITA") tag.classList.add('prepartita');
                else if (data.phase === "INTERVALLO") tag.classList.add('intervallo');
                else if (data.phase === "PRE SUDDEN DEATH") tag.classList.add('presuddendeath');
                else if (data.phase === "SUDDEN DEATH") tag.classList.add('suddendeath');
            }
        });
    </script>
</body>
</html>
