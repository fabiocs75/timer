<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Display Timer - Cosenza</title>
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        .bg-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('bannerAsCosenzaBIG.jpeg'); background-size: cover; background-position: center; filter: brightness(0.3); z-index: -1; }
        .container { height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px; padding: 60px 100px; text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.6); width: 90%; max-width: 1100px; position: relative; }
        .period-tag { background: #c21d23; color: white; padding: 10px 30px; border-radius: 50px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; display: inline-block; transition: all 0.5s ease; }
        
        /* Classi dinamiche per le fasi[cite: 5, 6] */
        .period-tag.prepartita { background: #1d3557; }
        .period-tag.intervallo { background: #ffd700; color: #000; }
        
        /* Stile specifico per Sudden Death */
        .period-tag.suddendeath { 
            background: #000; 
            color: #ff0000; 
            border: 2px solid #ff0000; 
            box-shadow: 0 0 20px #ff0000; 
            animation: pulse 1.5s infinite;
        }

        .timer-val { font-size: 20rem; font-weight: 900; color: #ffffff; font-variant-numeric: tabular-nums; line-height: 1; margin: 20px 0; text-align: center; text-shadow: 0 0 60px rgba(0,0,0,0.8); font-family: 'Inter', monospace; display: block; width: 100%; }

        .period-tag.presuddendeath { 
            background: #ff8c00; /* Arancione scuro */
            color: white;
            border: 2px solid #fff;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="container">
        <div class="glass-panel">
            <div id="period" class="period-tag">PREPARTITA</div>
            <div id="display" class="timer-val">00:00</div>
        </div>
    </div>

    <script>
        // Ascolta gli aggiornamenti dal controller[cite: 5, 6]
        window.addEventListener('storage', (e) => {
            if (e.key === 'timer_update') {
                const data = JSON.parse(e.newValue);
                
                // Aggiorna testo
                document.getElementById('display').textContent = data.time;
                document.getElementById('period').textContent = data.phase;
                
                // Gestione classi CSS per i colori[cite: 5, 6]
                const tag = document.getElementById('period');
                tag.className = 'period-tag'; // Reset classi
                
                if (data.phase === "PREPARTITA") {
                    tag.classList.add('prepartita');
                } else if (data.phase === "INTERVALLO") {
                    tag.classList.add('intervallo');
                }
                else if (data.phase === "PRE SUDDEN DEATH") tag.classList.add('presuddendeath');
                else if (data.phase === "SUDDEN DEATH") {
                    tag.classList.add('suddendeath');
                }
                // Se è 1° o 2° tempo, rimane la classe base rossa
            }
        });
    </script>
</body>
</html>
