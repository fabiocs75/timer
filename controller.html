<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pannello di Controllo - Pro Match</title>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            padding: 15px; 
            background: #f4f4f9; 
            color: #333; 
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .panel { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 98%; 
            max-width: 1200px;
            display: flex;
            gap: 20px;
        }

        /* Colonna Sinistra: Monitor */
        .sidebar-monitor {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .live-monitor { 
            background: #1d3557; 
            color: #fff; 
            padding: 30px 10px; 
            border-radius: 12px; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        .live-time { font-size: 4.5rem; font-weight: 900; font-family: monospace; line-height: 1; }
        .live-phase { text-transform: uppercase; letter-spacing: 2px; font-size: 1rem; opacity: 0.8; margin-bottom: 10px; }

        /* Colonna Destra: Controlli */
        .main-content {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .section { 
            background: #f8f9fa;
            padding: 15px; 
            border-radius: 10px;
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h2 { margin: 0 0 10px 0; color: #1d3557; font-size: 1rem; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-weight: bold; font-size: 0.8rem; margin-bottom: 3px; display: block; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 100%; box-sizing: border-box; font-size: 0.9rem; }
        
        .controls { display: flex; gap: 10px; }
        button { flex: 1; padding: 15px; font-weight: 800; cursor: pointer; border: none; border-radius: 8px; text-transform: uppercase; font-size: 0.9rem; }
        
        .btn-start { background: #1d3557; color: white; }
        .btn-pause { background: #c21d23; color: white; }
        .btn-reset { background: #6c757d; color: white; }
        
        /* Tasto OK grande sotto il campo */
        .btn-apply { 
            background: #ffd700; 
            color: #000; 
            margin-top: 10px; 
            width: 100%;
            padding: 12px;
        }

        .sd-container { 
            display: flex; 
            align-items: center; 
            background: #fff5f5; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #feb2b2; 
            margin-top: 10px;
        }
        .sd-container input { width: auto; margin-right: 10px; transform: scale(1.2); }
        .sd-label { color: #c53030; font-weight: 900; font-size: 0.75rem; }
    </style>
</head>
<body>
    <div class="panel">
        <!-- MONITOR LATERALE -->
        <div class="sidebar-monitor">
            <div class="live-monitor">
                <div class="live-phase" id="monitorPhase">PREPARTITA</div>
                <div class="live-time" id="monitorTime">00:00</div>
            </div>
            <div class="controls">
                <button id="mainBtn" class="btn-start" onclick="toggleTimer()">Avvia</button>
                <button class="btn-reset" onclick="resetMatch()">Reset</button>
            </div>
        </div>

        <!-- CONTROLLI PRINCIPALI -->
        <div class="main-content">
            <div class="section-row">
                <!-- Configurazione -->
                <div class="section">
                    <div>
                        <h2>Configurazione Tempi</h2>
                        <div class="grid">
                            <div><label>Pre (min):</label><input type="number" id="cfgPre" value="5"></div>
                            <div><label>Gara (min):</label><input type="number" id="cfgTempo" value="15"></div>
                            <div><label>Int (min):</label><input type="number" id="cfgInt" value="3"></div>
                            <div><label>SD (min):</label><input type="number" id="cfgSD" value="10"></div>
                        </div>
                    </div>
                    <div class="sd-container">
                        <input type="checkbox" id="sdEnabled">
                        <label class="sd-label">ABILITA SUDDEN DEATH</label>
                    </div>
                </div>

                <!-- Sincronizzazione -->
                <div class="section">
                    <div>
                        <h2>Sincronizzazione</h2>
                        <label>Salta alla Fase:</label>
                        <select id="phaseSelector" onchange="jumpToPhase()">
                            <option value="0">PREPARTITA</option>
                            <option value="1">1° TEMPO</option>
                            <option value="2">INTERVALLO</option>
                            <option value="3">2° TEMPO</option>
                            <option value="4">PRE SUDDEN DEATH</option>
                            <option value="5">SUDDEN DEATH</option>
                        </select>
                        <label style="margin-top:15px">Tempo Manuale (MM:SS):</label>
                        <input type="text" id="manualTime" placeholder="es. 09:45">
                    </div>
                    <button class="btn-apply" onclick="setManualTime()">Applica Tempo</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioInizio" src="suoni/Start.mp3"></audio>
    <audio id="audioFine" src="suoni/End.mp3"></audio>

    <script>
        let timeLeft, timerId = null, isRunning = false, currentPhase = 0;
        const phases = ["PREPARTITA", "1° TEMPO", "INTERVALLO", "2° TEMPO", "PRE SUDDEN DEATH", "SUDDEN DEATH"];

        window.addEventListener('storage', (e) => {
            if (e.key === 'timer_update') {
                const data = JSON.parse(e.newValue);
                document.getElementById('monitorTime').textContent = data.time;
                document.getElementById('monitorPhase').textContent = data.phase;
            }
        });

        function syncDisplay() {
            const min = Math.floor(Math.abs(timeLeft) / 60).toString().padStart(2, '0');
            const sec = (Math.abs(timeLeft) % 60).toString().padStart(2, '0');
            const timeString = `${min}:${sec}`;
            localStorage.setItem('timer_update', JSON.stringify({ time: timeString, phase: phases[currentPhase] }));
            document.getElementById('monitorTime').textContent = timeString;
            document.getElementById('monitorPhase').textContent = phases[currentPhase];
        }

        function jumpToPhase() {
            stopCountdown();
            currentPhase = parseInt(document.getElementById('phaseSelector').value);
            
            if (currentPhase === 0) timeLeft = document.getElementById('cfgPre').value * 60;
            else if (currentPhase === 1 || currentPhase === 3) timeLeft = document.getElementById('cfgTempo').value * 60;
            else if (currentPhase === 2) timeLeft = document.getElementById('cfgInt').value * 60;
            else if (currentPhase === 4) timeLeft = 30;
            else if (currentPhase === 5) timeLeft = document.getElementById('cfgSD').value * 60;

            document.getElementById('mainBtn').textContent = "Avvia";
            document.getElementById('mainBtn').className = "btn-start";
            syncDisplay();
        }

        function setManualTime() {
            const val = document.getElementById('manualTime').value;
            const parts = val.split(':');
            if (parts.length === 2) {
                const m = parseInt(parts[0]);
                const s = parseInt(parts[1]);
                if (!isNaN(m) && !isNaN(s)) {
                    timeLeft = (m * 60) + s;
                    syncDisplay();
                }
            }
        }

        function toggleTimer() {
            if (!isRunning) {
                const isStart = (
                    (currentPhase === 1 && timeLeft == document.getElementById('cfgTempo').value * 60) ||
                    (currentPhase === 3 && timeLeft == document.getElementById('cfgTempo').value * 60) ||
                    (currentPhase === 5 && timeLeft == document.getElementById('cfgSD').value * 60)
                );
                if (isStart) {
                    const audio = document.getElementById('audioInizio');
                    audio.play();
                    audio.onended = () => startCountdown();
                } else { startCountdown(); }
            } else { stopCountdown(); }
        }

        function startCountdown() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('mainBtn').textContent = "Pausa";
            document.getElementById('mainBtn').className = "btn-pause";
            timerId = setInterval(() => {
                if (timeLeft > 0) timeLeft--;
                else nextPhase();
                syncDisplay();
            }, 1000);
        }

        function stopCountdown() {
            clearInterval(timerId);
            timerId = null; isRunning = false;
            document.getElementById('mainBtn').textContent = "Riprendi";
            document.getElementById('mainBtn').className = "btn-start";
        }

        function nextPhase() {
            stopCountdown();
            const cfgTempo = document.getElementById('cfgTempo').value * 60;
            const cfgInt = document.getElementById('cfgInt').value * 60;
            const cfgSD = document.getElementById('cfgSD').value * 60;

            if (currentPhase === 0) { 
                currentPhase = 1; timeLeft = cfgTempo; 
                document.getElementById('audioInizio').play(); 
                document.getElementById('audioInizio').onended = () => startCountdown(); 
            }
            else if (currentPhase === 1) { 
                currentPhase = 2; 
                document.getElementById('audioFine').play(); 
                timeLeft = cfgInt; 
                document.getElementById('audioFine').onended = () => startCountdown(); 
            }
            else if (currentPhase === 2) { 
                currentPhase = 3; timeLeft = cfgTempo; 
                document.getElementById('audioInizio').play(); 
                document.getElementById('audioInizio').onended = () => startCountdown(); 
            }
            else if (currentPhase === 3) { 
                document.getElementById('audioFine').play(); 
                if (document.getElementById('sdEnabled').checked) { currentPhase = 4; timeLeft = 30; } 
                else 
                    {             
                    currentPhase = 0;
                    timeLeft = document.getElementById('cfgPre').value * 60;} 
            }
            else if (currentPhase === 4) { 
                currentPhase = 5; timeLeft = cfgSD; 
                document.getElementById('audioInizio').play(); 
                document.getElementById('audioInizio').onended = () => startCountdown(); 
            }
            else if (currentPhase === 5) { 
                document.getElementById('audioFine').play();
                currentPhase = 0;
                timeLeft = document.getElementById('cfgPre').value * 60;
            }
            
            document.getElementById('phaseSelector').value = currentPhase;
            syncDisplay();
        }

        function resetMatch() { if(confirm("Resettare la partita?")) location.reload(); }

        window.onload = () => { 
            timeLeft = document.getElementById('cfgPre').value * 60; 
            syncDisplay(); 
        };
    </script>
</body>
</html>
